version: "1.0"
name: "Game Mechanic Lab default mechanics"
components:
  hp:
    type: resource
    min: 0
    regen_per_second: 0
  attack:
    type: scalar
  defense:
    type: scalar
  critical:
    type: chance_and_multiplier
    chance_range: [0.0, 1.0]
    default_multiplier: 1.5
  attack_speed:
    type: rate
    attacks_per_second_min: 0.1
  move_speed:
    type: scalar
  cooldown:
    type: timer
  mana:
    type: resource
  stamina:
    type: resource
  i_frame:
    type: duration
    unit: seconds
  dodge:
    type: probability_or_action
  knockback:
    type: distance
  hitstun:
    type: duration
    unit: seconds
  projectile:
    type: spawned_entity
  aoe:
    type: area
  dot:
    type: periodic_damage
  hot:
    type: periodic_heal
  buff:
    type: modifier
  debuff:
    type: modifier
  shield:
    type: absorb_pool
  combo:
    type: sequence
formulas:
  damage: "max(0, attack * multiplier - defense)"
  critical_damage: "max(0, attack * multiplier * critical_multiplier - defense)"
  effective_cooldown: "max(0.05, cooldown * (1 - cooldown_reduction))"
  dps: "total_damage / max(0.001, elapsed_seconds)"
  ttk: "elapsed_seconds if target_hp <= 0 else null"
  effective_hp: "hp + shield"
simulation_defaults:
  basic_attack_range: 2.0
  engagement_distance: 1.5
  dodge_cost: 20.0
  dodge_recovery: 0.2
  fast_enemy_exposure: 1.0
status_effects:
  burn:
    kind: dot
    duration: 4.0
    tick_interval: 1.0
    magnitude: 8.0
    damage_per_tick: 8.0
  slow:
    kind: debuff
    duration: 3.0
    modifiers: {move_speed: -1.75}
    move_speed_multiplier: 0.65
  armor_break:
    kind: debuff
    duration: 4.0
    modifiers: {defense: -12.0}
    defense_flat: -12.0
  haste:
    kind: buff
    duration: 3.0
    modifiers: {attack_speed: 0.25}
    attack_speed_multiplier: 1.25
  regeneration:
    kind: hot
    duration: 4.0
    heal_per_tick: 14.0
    magnitude: 14.0
balance_warning_rules:
  - {id: infinite_combo, label: "Infinite Combo", condition: "combo_stacks > 100 or combo_reset_seconds <= 0"}
  - {id: permanent_stun, label: "Permanent Stun", condition: "stun_uptime >= 0.95"}
  - {id: full_crit, label: "100% Crit", condition: "critical >= 1.0"}
  - {id: negative_damage, label: "Negative Damage", condition: "damage < 0"}
  - {id: unkillable_build, label: "Unkillable Build", condition: "target_hp > 0 and elapsed_seconds >= max_time"}
  - {id: dps_explosion, label: "DPS Explosion", condition: "dps > baseline_dps * 3"}
  - {id: cooldown_loop, label: "Cooldown Loop", condition: "effective_cooldown <= 0.05"}
